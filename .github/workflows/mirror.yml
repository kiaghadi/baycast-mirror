name: mirror
on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get the copy published so far
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy requests h5py
      - run: python mirror.py site
      - name: Publish (one commit, no history, so the repository stays small)
        run: |
          cd site
          rm -rf .git
          git init -q -b gh-pages
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "BayCAST copy $(date -u +%FT%RZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
